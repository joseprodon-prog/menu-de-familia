(async()=>{DB=await window.claude.use("db");SB=window.MF_SB;const u=await window.claude.use("user");const uid=await u.id();let okH=false;try{const r=await SB.rpc("is_hortola");okH=!!(r&&r.data===true);}catch(e){}if(okH)HORTOLA=uid;
 if(!okH){$("#main").innerHTML=`<div class="noacc">Aquesta pàgina és només per a l'Hortolà. Has entrat amb un altre compte.<br><br><button class="btn" onclick="MF_SB.auth.signOut()">Surt i entra amb el compte de l'Hortolà</button></div>`;return;}
 $("#main").innerHTML=`<div class="kpis" id="kpis"></div>`+bar("usu","👥","Usuaris i invitacions","Qui convidem i qui fa servir l'app")+bar("pre","⭐","Sembradors","Sol·licituds, aprovacions i seguiment")+bar("cre","📈","Creixement","Famílies noves i recomanacions")+bar("vei","🏘️","Veïnat","Famílies més actives i regals d'espigues")+bar("beta","🧪","Fase beta","Comparador de funcions i subfases")+bar("bus","📬","Bústia","Missatges dels usuaris")+bar("est","🍳","Estris nous","Icones que demanen els usuaris")+bar("ord","🧺","Comandes rebudes","Comandes de la Botiga")+bar("cat","🏷️","Catàleg de la Botiga","Productes d'El Sortidor")+bar("il","🎨","Il·lustracions del Graner","El Capità dibuixa les receptes sense imatge")+bar("ver","🚀","Versions","Què hem canviat a l'app")+bar("not","📝","Notes i enllaços","Accessos i apunts")+`<p class="foot" style="text-align:center"><button class="btn sec" onclick="MF_SB.auth.signOut()">Tanca la sessió</button></p>`;setTimeout(()=>{try{admOrdApply();admOrdLoad();}catch(_){}},0);
 DB.collection("feedback").onSnapshot(s=>{FB=s.docs.map(d=>({uid:d.id,...d.data()}));drawBus();kpis();},()=>{});
 DB.collection("comandes").onSnapshot(s=>{ORD=s.docs.map(d=>({uid:d.id,...d.data()}));drawOrd();kpis();try{if(!PEDIT)drawCat();}catch(_){}},()=>{});
 DB.doc("botiga/cataleg").onSnapshot(d=>{SHOP=(d.exists&&d.data().items)||{};drawCat();},()=>{});
 DB.doc("admin/convidats").onSnapshot(d=>{if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("[data-uf-id]"))){CONV=(d.exists&&d.data().items)||CONV;}CONVV=true;convSync();drawUsu();kpis();},()=>{CONVV=false;drawUsu(true);});
 DB.doc("botiga/premium").onSnapshot(d=>{PREMH=(d.exists&&d.data().h)||{};drawUsu();drawBus();},()=>{});
 DB.doc("botiga/funcions").onSnapshot(d=>{FUNH=(d.exists&&d.data().h)||{};drawUsu();},()=>{});
 DB.doc("admin/notes").onSnapshot(d=>{if(document.activeElement&&document.activeElement.id==="mynote")return;NOTE=(d.exists&&d.data().t)||"";drawNot();},()=>drawNot());
 loadFam();loadVer();drawNot();estLoad();setInterval(estLoad,60000);
 document.addEventListener("toggle",e=>{const d=e.target;if(d.id==="il"&&d.open)ilLoad();if(d.id==="vei"&&d.open)veiLoad();if(d.id==="beta"&&d.open)betaLoad();if(d.matches&&d.matches("details.bar")&&d.open)(d.parentElement||document).querySelectorAll(":scope>details.bar[open]").forEach(o=>{if(o!==d)o.open=false});},true);
})();

function kpis(){const pc=Object.values(CONV).filter(c=>estOf(c)===0).length;const items=FB.flatMap(f=>Object.values(f.items||{}));const nous=items.filter(i=>i&&i.estat==="nou").length;
 const ords=ORD.flatMap(u=>Object.values(u.items||{}));const pend=ords.filter(o=>o&&["rebuda","confirmada"].includes(o.estat)).length;
 $("#kpis").innerHTML=[[pc,"Per convidar",pc>0],[nous,"Missatges nous",nous>0],[pend,"Comandes pendents",pend>0],[USERS.length,"Usuaris amb compte"]].map(([v,l,a])=>`<div class="kpi${a?" alert":""}"><b>${v}</b><small>${l}</small></div>`).join("");
 $("#c_bus").textContent=nous||"";$("#c_usu").textContent=pc||"";$("#c_ord").textContent=pend||"";}

/* ---------- Bústia: una conversa per usuari ---------- */
let PREMH={},FAMHS={},BOPEN=null,FUNH={};
const FUNCS=[["nevera","📸 Què cuino amb el que tinc?","Receptari: 3 plats a partir de fotos de la nevera o el rebost"]];
const funOn=(f,k)=>{const e=f&&FUNH[FAMHS[f.code]];return !!(e&&e[k]);};
async function funSet(code,k,on){await famHashes();const h=FAMHS[code];const n=JSON.parse(JSON.stringify(FUNH));n[h]={...(n[h]||{})};if(on)n[h][k]=true;else delete n[h][k];if(!Object.keys(n[h]).length)delete n[h];FUNH=n;drawUsu();try{await DB.doc("botiga/funcions").set({h:n});toast(on?"Funció activada":"Funció desactivada");}catch(e){toast("No s'ha pogut desar");}}
async function famHashA(code){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mf:"+code));return [...new Uint8Array(b)].slice(0,6).map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return "h"+code.slice(-6).toLowerCase();}}
async function famHashes(){for(const f of FAMS){if(!FAMHS[f.code])FAMHS[f.code]=await famHashA(f.code);}}
const famSt=f=>{const e=f&&PREMH[FAMHS[f.code]];return e?(e.estat||"act"):null;};const famPrem=f=>famSt(f)==="act";
const uidFam=u=>FAMS.find(f=>f.membres&&f.membres[u]);
function convOf(f){const it=Object.entries(f.items||{}).map(([k,x])=>({k,...x}));const out=[];it.forEach(x=>{out.push(x);if(x.resp&&x.de!=="h")out.push({k:x.k+"_r",de:"h",t:x.resp,at:x.respAt||x.at});});return out.sort((a,b)=>String(a.at).localeCompare(String(b.at)));}
function drawBus(){const el=$("#b_bus");if(!el)return;setTimeout(()=>{try{aiDraw&&document.querySelectorAll(".aib").forEach(b=>b.classList.toggle("on",b.dataset.aiop===AICUR))}catch(_){}},0);
 const C=FB.map(f=>{const M=convOf(f);const fam=uidFam(f.uid);const nous=M.filter(m=>m.de!=="h"&&(m.estat||"nou")==="nou");return {f,M,fam,prem:famPrem(fam)||!!f.prem,nous:nous.length,err:nous.filter(m=>m.tipus==="err").length,want:M.some(m=>m.tipus==="prem")&&!famSt(fam),last:M.length?M[M.length-1].at:""};}).filter(c=>c.M.length);
 C.sort((a,b)=>((b.nous>0)||b.want)-((a.nous>0)||a.want)||(b.prem-a.prem)||(b.err-a.err)||String(b.last).localeCompare(String(a.last)));
 C.forEach(c=>{c.pend=c.nous>0||c.want||famSt(c.fam)==="apr";});const L=FBF==="nou"?C.filter(c=>c.pend):C;
 const fd=a=>{const d=new Date(a);return d.toLocaleDateString("ca",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("ca",{hour:"2-digit",minute:"2-digit"});};
 el.innerHTML=`${window.AIVIEW?"":`<div class="row" style="justify-content:flex-end;margin:0 0 6px"><button class="btn sec" data-avopen>🗂 Treballa amb Claude (pantalla dividida)</button></div>`}<div class="seg">${[["nou","Pendents"],["","Totes"]].map(([k,l])=>`<button type="button" data-fbf="${k}" aria-pressed="${FBF===k}">${l} <small>${k?C.filter(c=>c.pend).length:C.length}</small></button>`).join("")}</div>`+
 (L.length?L.map(c=>{const open=BOPEN===c.f.uid;return `<details class="sub conv" data-cv="${c.f.uid}"${open?" open":""}><summary><span class="dot" style="background:${c.nous?"var(--hort)":"var(--ok)"}"></span><span class="btx"><b>${esc(c.f.nom||"Usuari")}${c.prem?" ⭐":""}${c.err?` <span class="ebadge">🔧 ${c.err}</span>`:""}${c.want?` <span class="pbadge">vol ser Sembrador</span>`:""}</b><small>${c.fam?"Família "+esc(c.fam.nom||""):esc(c.f.fam||"")} · ${fd(c.last)}</small></span>${c.nous?`<span class="cnt">${c.nous}</span>`:""}<span class="chev sm"></span></summary>${open?`<div class="ubody"><div class="thr">${c.M.map(m=>m.de==="h"?`<div class="bm h"><span>${esc(m.t).replace(/\n/g,"<br>")}</span><small>Tu · ${fd(m.at)}${m.llegit?" · llegit":""}</small></div>`:`<div class="bm u">${m.tipus==="err"?'<b class="etag">🔧 Per millorar</b>':m.tipus==="prem"?'<b class="ptag">⭐ Vol ser Sembrador</b>':""}<span>${esc(m.t).replace(/\n/g,"<br>")}</span><small>${fd(m.at)}${m.pant?" · "+esc(m.pant):""}${m.ver?" · v"+esc(String(m.ver).slice(-4)):""}</small>${m.tipus!=="prem"?(m.premi?`<small class="pmi">🌾 Premiada amb ${m.premi} espigues${m.premiOk?" ✓":""}</small>`:`<button class="pmb" data-premi="${c.f.uid}|${m.k}">🌾 Idea per a tothom: +500 espigues</button>`):""}<button class="aib" data-aiop="${c.f.uid}|${m.k}">💬 Pensem-ho amb Claude</button></div>`).join("")}</div>
  <textarea data-cvr="${c.f.uid}" placeholder="Escriu la resposta (li arriba al xat de l'Hortolà)"></textarea><div class="row"><button class="btn" data-cvs="${c.f.uid}">Envia</button>${c.nous?`<button class="btn sec" data-cvl="${c.f.uid}">Marca com a llegit</button>`:""}</div>${c.fam?`<div class="row pflow"><span class="foot">Pla de ${esc(c.fam.nom||"la família")}: <b>${({sol:"Sol·licitat",apr:"Aprovat · pendent de pagament",act:"⭐ Sembrador"})[famSt(c.fam)||(c.want?"sol":"")]||"Gratuït"}</b></span>${!famSt(c.fam)?`<button class="btn sec" data-pmapr="${c.fam.code}|${c.f.uid}">✅ Aprova i envia la informació</button>`:""}${famSt(c.fam)==="apr"?`<button class="btn" data-pmact="${c.fam.code}">⭐ Activa Sembrador (pagat)</button>`:""}${famSt(c.fam)==="act"?`<button class="btn sec" data-pmoff="${c.fam.code}">Treu Sembrador</button>`:""}</div>`:""}</div>`:""}</details>`;}).join(""):`<p class="foot">No hi ha converses ${FBF==="nou"?"pendents":""}.</p>`);

async function cvSave(uid,mut){const x=FB.find(f=>f.uid===uid);if(!x)return;const items={...(x.items||{})};mut(items);x.items=items;drawBus();kpis();try{await DB.doc("feedback/"+uid).set({nom:x.nom||"",fam:x.fam||"",prem:!!x.prem,items});toast("Desat");}catch(e){toast("No s'ha pogut desar");}}

async function premSet(code,estat){await famHashes();const f=FAMS.find(x=>x.code===code);const h=FAMHS[code];const n={...PREMH};if(!estat)delete n[h];else{const o=n[h]||{};const now=new Date().toISOString();n[h]={...o,nom:(f&&f.nom)||o.nom||"",estat,at:now,...(estat==="apr"&&!o.apr?{apr:now}:{}),...(estat==="act"&&!o.desde?{desde:now}:{})};}PREMH=n;drawUsu();drawBus();try{await DB.doc("botiga/premium").set({h:n});toast(estat==="act"?"⭐ Ara és Sembradora":estat==="apr"?"Sol·licitud aprovada":"Ara és Gratuïta");}catch(e){toast("No s'ha pogut desar");}}
const PINFO=`Hola! He aprovat la vostra sol·licitud per ser sembradors ⭐

Què hi guanyeu:
🎨 Personalització de l'app
💡 Participació en les millores: si una idea vostra la posem al servei de tothom, us premiem amb espigues 🌾
🧑‍🌾 Xat directe amb mi, l'Hortolà
🎁 Incentius i regals especials durant tota la subscripció
🏘️ Crear el vostre propi veïnat
🤝 El pas per ser col·laboradors actius del projecte

Per activar-ho: [preu i forma de pagament]

function pStats(){const S={};ORD.forEach(u=>{Object.values(u.items||{}).forEach(o=>{if(o.estat==="anullada")return;const seen=new Set();(o.linies||[]).forEach(x=>{const k=x.pid;if(!k)return;S[k]=S[k]||{u:0,c:0,v:0,r:[]};S[k].u+=+x.q||0;if(!seen.has(k)){S[k].c++;seen.add(k);}});});
 Object.entries(u.vistes||{}).forEach(([k,n])=>{S[k]=S[k]||{u:0,c:0,v:0,r:[]};S[k].v+=+n||0;});
 Object.entries(u.ress||{}).forEach(([k,x])=>{if(x&&x.t){S[k]=S[k]||{u:0,c:0,v:0,r:[]};S[k].r.push({t:x.t,at:x.at,f:u.fam||u.nom||""});}});});return S;}

 const ven=Math.round(st.u/mu*100),int=Math.round(st.v/mv*100),con=st.v?Math.min(100,Math.round(st.c/st.v*100)):null,val=p.rs&&typeof p.rs.score==="number"?p.rs.score:null;
 const bar=(l,v,sub,c)=>`<div class="pind" title="${l}: ${v==null?"—":v} · ${String(sub).replace(/"/g,"&quot;")}"><span class="pib"><i style="width:${v==null?0:v}%;background:${c}"></i></span><b>${v==null?"—":v}</b></div>`;
 return `<div class="pinds">${bar("Vendes",ven,st.u+" u.","#2a78c2")}${bar("Interès",int,st.v+" consultes","#d99a1e")}${bar("Conversió",con,st.v?st.c+" de "+st.v:"sense consultes","#6e8c3c")}${bar("Valoració",val,st.r.length+(st.r.length===1?" ressenya":" ressenyes")+(p.rs&&p.rs.res?" · "+esc(p.rs.res):""),"#b5502e")}</div>`;}

 if(!ilLoad.sub){ilLoad.sub=1;DB.doc("graner/il").onSnapshot(d=>{ILMAP=(d.exists&&d.data().items)||{};drawIl();},()=>{});DB.doc("graner/estil").onSnapshot(d=>{if(document.activeElement&&document.activeElement.id==="ilest")return;ILEST=(d.exists&&d.data().t)||ILPRE.foto;drawIl();},()=>{});
  DB.collection("receptes").onSnapshot(s=>{ILU=[];s.docs.forEach(d=>{const uid=d.id.split("/").pop();const it=(d.data()||{}).items||{};for(const[id,x]of Object.entries(it))if(x&&x.n)ILU.push({k:"u_"+uid.slice(0,12)+"_"+id,n:x.n,cat:x.cat||"",ing:String(x.ing||"").replace(/\n/g,"; ").slice(0,600),steps:String(x.steps||"").replace(/\n/g," ").slice(0,600),foto:!!x.foto,fam:x.fam||""});});drawIl();},()=>{});}
 drawIl();}

async function ilDo(k,nota){const r=ilList().find(x=>x.k===k);if(!r||ILBUSY[k])return;ILBUSY[k]=1;drawIl();
 try{const bl=await window.MF_DIBUIXA({fotos:[],n:r.n,ing:r.ing,steps:r.steps,...(nota&&ILMAP[k]?{baseUrl:window.BLOBBASE+ILMAP[k],nota}:{})});const up=await ILAS.upload(bl,{type:bl.type||"image/png"});ILMAP={...ILMAP,[k]:up.id};await DB.doc("graner/il").set({items:ILMAP});ILMSG="";delete ILERR[k];ILOK[k]="Refeta ✓ a les "+new Date().toLocaleTimeString("ca",{hour:"2-digit",minute:"2-digit"})+(nota?" · amb indicacions":"");}

let VEIA=null,VREG={},VPER="mes",VGIFT={},VSUB=false,VZON={};
const vMon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10);};
function veiLoad(){if(VSUB)return;VSUB=true;
 DB.collection("veinat").onSnapshot(s=>{VEIA=s.docs.map(d=>d.data()||{});drawVeiA();},()=>{VEIA=[];drawVeiA();});
 DB.collection("zones").onSnapshot(s=>{VZON={};s.docs.forEach(d=>{VZON[String(d.id).split("/").pop()]=d.data()||{};});drawVeiA();},()=>{});
 DB.collection("regals").onSnapshot(s=>{VREG={};s.docs.forEach(d=>{VREG[String(d.id).split("/").pop()]=(d.data()||{}).items||{};});drawVeiA();},()=>{});}
function veiRank(){const now=new Date(),wk=vMon(now),mo=now.toISOString().slice(0,7);const by={};
 (VEIA||[]).forEach(v=>{const k=v.code||v.fh;if(!k)return;const o=by[k]||(by[k]={code:v.code||"",fam:v.fam||"Família",muni:"",lvl:0,xp:0,wk:{},zreq:{}});o.fam=v.fam||o.fam;if(v.muni)o.muni=v.muni;Object.assign(o.zreq,v.zreq||{});if(v.code)o.code=v.code;o.lvl=Math.max(o.lvl,v.lvl||1);o.xp=Math.max(o.xp,v.xp||0);
  Object.entries(v.wk||{}).forEach(([w,n])=>{o.wk[w]=Math.max(o.wk[w]||0,+n||0);});});
 return Object.values(by).map(o=>{const sm=o.wk[wk]||0,mm=Object.entries(o.wk).filter(([w])=>w.slice(0,7)===mo).reduce((a,[,n])=>a+n,0);
  const rg=Object.values(VREG[o.code]||{}).filter(r=>r&&String(r.at||"").slice(0,7)===mo).reduce((a,r)=>a+(+r.n||0),0);return {...o,sm,mm,rg};}).sort((a,b)=>VPER==="mes"?(b.mm-a.mm)||(b.sm-a.sm):(b.sm-a.sm)||(b.mm-a.mm));}
function drawVeiA(){const el=$("#b_vei");if(!el)return;if(!VEIA){el.innerHTML=`<p class="foot">Carregant…</p>`;return;}const L=veiRank();
 const PZ=[];L.forEach(x=>{const Z=VZON[x.code]||{};Object.entries(x.zreq||{}).forEach(([mc,r])=>{if(!(Z.ext||{})[mc]&&!(Z.neg||{})[mc])PZ.push({code:x.code,fam:x.fam,mc,...r});});});
 const c=$("#c_vei");if(c)c.textContent=(PZ.length?PZ.length+" · ":"")+(L.length||"");
 el.innerHTML=(PZ.length?`<span class="label">Sol·licituds de zones</span>${PZ.map(z=>`<div class="card vist vrk"><div class="vrkh"><span class="vpos">📍</span><b>${esc(z.fam)} → ${esc(z.n||z.mc)}</b><small>${esc(z.motiu||"")} · ${esc(z.at||"")}</small></div><div class="row"><button type="button" class="btn pvis" data-zok="${esc(z.code)}|${esc(z.mc)}">Aprova</button><button type="button" class="btn sec" data-zno="${esc(z.code)}|${esc(z.mc)}">Descarta</button></div></div>`).join("")}`:"")+`<p class="foot">Rànquing intern: les famílies no el veuen. Puntuació = espigues guanyades amb missions i accions (setmana en curs o mes en curs).</p>
 <div class="seg"><button type="button" data-vper="setm" aria-pressed="${VPER==="setm"}">Aquesta setmana</button><button type="button" data-vper="mes" aria-pressed="${VPER==="mes"}">Aquest mes</button></div>`+
 (L.length?L.map((x,i)=>{const g=VGIFT[x.code]??50;return `<div class="card vist vrk"><div class="vrkh"><span class="vpos">${["🥇","🥈","🥉"][i]||i+1}</span><b>${esc(x.fam)}</b><small>${x.muni?"📍 "+esc(x.muni)+" · ":""}Nivell ${x.lvl} · ${VPER==="mes"?x.mm:x.sm} 🌾 ${VPER==="mes"?"aquest mes":"aquesta setmana"}${x.rg?` · 🎁 ${x.rg} regalades`:""}</small></div>
  ${x.code?`<div class="row vgift"><span class="pill"><button type="button" data-vg="${esc(x.code)}" data-d="-10" aria-label="Menys">−</button><b>${g} 🌾</b><button type="button" data-vg="${esc(x.code)}" data-d="10" aria-label="Més">+</button></span><button type="button" class="btn" data-vgo="${esc(x.code)}">🎁 Regala</button></div>`:`<p class="foot">Encara no es pot regalar: cal que la família torni a obrir l'app.</p>`}</div>`;}).join(""):`<p class="foot">Encara no hi ha famílies al veïnat.</p>`);}
document.addEventListener("click",async e=>{const zo=e.target.closest("[data-zok],[data-zno]");if(zo){const ok=!!zo.dataset.zok;const [code,mc]=(zo.dataset.zok||zo.dataset.zno).split("|");
  const x=(veiRank().find(r=>r.code===code)||{}).zreq||{};const r=x[mc]||{};zo.disabled=true;

  go.disabled=true;go.textContent="Enviant…";const now=new Date(),mes=now.toLocaleDateString("ca",{month:"long"});

function bTable(k,title,sub){const T=BETA[k];return `<span class="flab">${title}</span>${sub?`<p class="foot">${sub}</p>`:""}<div class="bwrap"><table class="btab"><thead><tr><th>Funció</th>${T.cols.map((c,j)=>`<th><input data-bc="${k}|${j}" value="${esc(c)}">${k==="t2"&&T.cols.length>1?`<button type="button" class="bx" data-bcd="${k}|${j}" aria-label="Treu la columna">×</button>`:""}</th>`).join("")}${k==="t2"?`<th><button type="button" class="badd" data-bca="${k}" aria-label="Afegeix una subfase">＋</button></th>`:""}</tr></thead>
 <tbody>${T.rows.map((r,i)=>`<tr><th><textarea rows="2" data-bf="${k}|${i}">${esc(r.f)}</textarea><button type="button" class="bx" data-brd="${k}|${i}" aria-label="Treu la fila">×</button></th>${T.cols.map((c,j)=>`<td class="${bCls(r.v[j])}"><textarea rows="2" data-bv="${k}|${i}|${j}" placeholder="—">${esc(r.v[j]||"")}</textarea><span class="bq"><button type="button" data-bq="${k}|${i}|${j}|✓">✓</button><button type="button" data-bq="${k}|${i}|${j}|—">—</button></span></td>`).join("")}${k==="t2"?"<td></td>":""}</tr>`).join("")}</tbody></table></div>

 el.innerHTML=`<div class="bx2"><span>Beta: espigues per passar de Planter a Sembrador</span><span class="pill"><button type="button" data-bxd="-100">−</button><b>${BETA.x} 🌾</b><button type="button" data-bxd="100">+</button></span></div>
 ${bTable("t1","Espiga i Sembradora","Què pot fer cada nivell d'usuari. Escriu a cada casella o toca ✓ / —.")}
 ${bTable("t2","Subfases de la beta","Què s'ofereix a cada subfase. Pots afegir subfases amb ＋.")}
 <p class="foot" id="bmsg">Es desa sol</p>`;bFit(el);}

document.addEventListener("input",e=>{const t=e.target;if(!BETA||!t.closest||!t.closest("#b_beta"))return;let a;
 t.style&&t.tagName==='TEXTAREA'&&(t.style.height='auto',t.style.height=t.scrollHeight+'px');if((a=t.dataset.bv)){const [k,i,j]=a.split("|");BETA[k].rows[+i].v[+j]=t.value;t.parentElement.className=bCls(t.value);betaSave();}
 else if((a=t.dataset.bf)){const [k,i]=a.split("|");BETA[k].rows[+i].f=t.value;betaSave();}
 else if((a=t.dataset.bc)){const [k,j]=a.split("|");BETA[k].cols[+j]=t.value;betaSave();}});
document.addEventListener("click",e=>{if(!BETA||!e.target.closest("#b_beta"))return;let b;
 if((b=e.target.closest("[data-bq]"))){const [k,i,j,v]=b.dataset.bq.split("|");BETA[k].rows[+i].v[+j]=v;drawBeta();betaSave();return;}
 if((b=e.target.closest("[data-bxd]"))){BETA.x=Math.max(100,(+BETA.x||0)+(+b.dataset.bxd));drawBeta();betaSave();return;}
 if((b=e.target.closest("[data-bra]"))){const T=BETA[b.dataset.bra];T.rows.push({f:"Funció nova",v:T.cols.map(()=>"")});drawBeta();betaSave();setTimeout(()=>{const ins=document.querySelectorAll(`[data-bf^="${b.dataset.bra}|"]`);const l=ins[ins.length-1];if(l){l.focus();l.select();}},40);return;}
 if((b=e.target.closest("[data-brd]"))){if(!b.dataset.sure){sureAsk(b);return;}const [k,i]=b.dataset.brd.split("|");BETA[k].rows.splice(+i,1);drawBeta();betaSave();return;}
 if((b=e.target.closest("[data-bca]"))){const T=BETA[b.dataset.bca];T.cols.push("Beta "+(T.cols.filter(c=>/^Beta/.test(c)).length+1));T.rows.forEach(r=>r.v.push(""));drawBeta();betaSave();return;}
 if((b=e.target.closest("[data-bcd]"))){if(!b.dataset.sure){sureAsk(b);return;}const [k,j]=b.dataset.bcd.split("|");BETA[k].cols.splice(+j,1);BETA[k].rows.forEach(r=>r.v.splice(+j,1));drawBeta();betaSave();}});

/* ===== dues columnes independents: ordre de les barres arrossegant ≡ (es desa a l'admin i al navegador) ===== */
let AORD=null;try{AORD=JSON.parse(localStorage.getItem("mf_admord")||"null");}catch(_){}
function admCols(){const m=$("#main");if(!m)return null;let c=m.querySelector(":scope>.cols");if(!c){const bars=[...m.querySelectorAll(":scope>details.bar")];if(!bars.length)return null;c=document.createElement("div");c.className="cols";c.innerHTML='<div class="col" id="colA"></div><div class="col" id="colB"></div>';bars[0].before(c);
 bars.forEach((x,i)=>c.children[i%2].appendChild(x));}return c;}
function admOrdApply(){const c=admCols();if(!c)return;let O=AORD;if(Array.isArray(O))O={a:O.filter((_,i)=>i%2===0),b:O.filter((_,i)=>i%2===1)};if(!O||!O.a)return;
 const all=[...c.querySelectorAll("details.bar")];const by=Object.fromEntries(all.map(x=>[x.id,x]));const used=new Set();
 [["a",c.children[0]],["b",c.children[1]]].forEach(([k,col])=>(O[k]||[]).forEach(id=>{const x=by[id];if(x){col.appendChild(x);used.add(id);}}));
 all.filter(x=>!used.has(x.id)).forEach(x=>{const A=c.children[0],B=c.children[1];(A.children.length<=B.children.length?A:B).appendChild(x);});}
(()=>{const m=$("#main");if(!m)return;let busy=false;const chk=()=>{if(busy)return;if(m.querySelector(":scope>details.bar")){busy=true;try{admOrdApply();}catch(e){console.log("ord",e);}busy=false;}};new MutationObserver(chk).observe(m,{childList:true});chk();})();
async function admOrdLoad(){try{const d=await DB.doc("admin/ordre").get();const v=d.exists?d.data():null;if(v&&(v.a||Array.isArray(v.ids))){AORD=v.a?{a:v.a,b:v.b||[]}:v.ids;try{localStorage.setItem("mf_admord",JSON.stringify(AORD));}catch(_){}admOrdApply();}}catch(_){}}
function admOrdSave(){const c=admCols();if(!c)return;AORD={a:[...c.children[0].querySelectorAll(":scope>details.bar")].map(x=>x.id),b:[...c.children[1].querySelectorAll(":scope>details.bar")].map(x=>x.id)};try{localStorage.setItem("mf_admord",JSON.stringify(AORD));}catch(_){}try{DB.doc("admin/ordre").set({...AORD,ids:null}).catch(()=>{});}catch(_){}}
(()=>{let drag=null,ph=null,dx=0,dy=0;
 document.addEventListener("click",e=>{if(e.target.closest(".bgrip"))e.preventDefault();},true);
 document.addEventListener("pointerdown",e=>{const g=e.target.closest(".bgrip");if(!g)return;const d=g.closest("details.bar");if(!d)return;e.preventDefault();
  if(d.open)d.open=false;const r=d.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;ph=document.createElement("div");ph.className="bar-ph";ph.style.height=r.height+"px";d.before(ph);
  drag=d;d.classList.add("bdrag");d.style.width=r.width+"px";d.style.left=r.left+"px";d.style.top=r.top+"px";try{g.setPointerCapture(e.pointerId);}catch(_){}});
 document.addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();drag.style.left=(e.clientX-dx)+"px";drag.style.top=(e.clientY-dy)+"px";
  const cols=[...document.querySelectorAll("#main .col")];const col=cols.find(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right;})||ph.parentElement;
  const bars=[...col.querySelectorAll(":scope>details.bar")].filter(b=>b!==drag);let placed=false;
  for(const b of bars){const r=b.getBoundingClientRect();if(e.clientY<r.top+r.height/2){if(b.previousElementSibling!==ph)b.before(ph);placed=true;break;}}
  if(!placed&&col.lastElementChild!==ph)col.appendChild(ph);
  if(e.clientY<70)scrollBy(0,-14);else if(e.clientY>innerHeight-60)scrollBy(0,14);},{passive:false});
 const end=()=>{if(!drag)return;const d=drag;drag=null;d.classList.remove("bdrag");d.style.width=d.style.left=d.style.top="";ph.replaceWith(d);ph=null;admOrdSave();};
 document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
 document.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest(".bgrip");if(!g)return;const d=g.closest("details.bar");let t=null;
  const cs=[...document.querySelectorAll("#main .col")];const ci=cs.indexOf(d.parentElement);
  if(e.key==="ArrowUp"){t=d.previousElementSibling;if(t&&t.matches("details.bar"))t.before(d);else return;}else if(e.key==="ArrowDown"){t=d.nextElementSibling;if(t&&t.matches("details.bar"))t.after(d);else return;}
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const o=cs[ci+(e.key==="ArrowLeft"?-1:1)];if(!o)return;o.appendChild(d);}else return;
  e.preventDefault();admOrdSave();g.focus();});})();
</script>

<script>
/* ---------- Xat amb Claude: una suggerència cada cop, en finestra flotant ---------- */
var AICH={},AICUR=null,AIBUSY=0,GUIATX=null;
try{AICH=JSON.parse(localStorage.getItem("mf_aich2")||"{}")}catch(_){}
const aiSave=()=>{try{localStorage.setItem("mf_aich2",JSON.stringify(AICH))}catch(_){}};
const aiEsc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const aiMd=s=>aiEsc(s).replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\n{3,}/g,"\n\n").trim();
const aiMsgOf=k=>{const [u,mk]=String(k).split("|");const f=FB.find(x=>x.uid===u);const it=f&&(f.items||{})[mk];return {u,mk,f,it};};
function aiMsgHtml(m,i){if(m.role==="user")return `<div class="aim u">${aiEsc(m.vis||m.content)}</div>`;
 const t=String(m.content||"");const parts=[];let last=0,n=0;const re=/<resposta>([\s\S]*?)<\/resposta>/g;let x;
 while((x=re.exec(t))){parts.push(aiMd(t.slice(last,x.index)));parts.push(`<div class="aiprop">${aiMd(x[1].trim())}<button class="btn" data-aiuse="${i}|${n++}">⬇ Fes-la servir</button></div>`);last=re.lastIndex;}
 parts.push(aiMd(t.slice(last)));return `<div class="aim a">${parts.filter(Boolean).join("\n")}</div>`;}
var AIVIEW=false,AIHOME=null;
function aiView(on){AIVIEW=on;let v=document.getElementById("aiview");const bb=document.getElementById("b_bus");
 if(on){if(!v){v=document.createElement("div");v.id="aiview";v.innerHTML=`<div class="avh">📬<span>Bústia · treballant amb Claude</span><button data-avx>✕ Torna a l'admin</button></div><div class="avb"><div class="avl"></div><div class="avr"></div></div>`;document.body.appendChild(v);}
  if(bb&&bb.parentElement!==v.querySelector(".avl")){AIHOME={p:bb.parentElement,n:bb.nextSibling};v.querySelector(".avl").appendChild(bb);}
  document.body.style.overflow="hidden";drawBus();aiDraw();}
 else{if(bb&&AIHOME){AIHOME.p.insertBefore(bb,AIHOME.n&&AIHOME.n.parentElement===AIHOME.p?AIHOME.n:null);AIHOME=null;}v&&v.remove();document.body.style.overflow="";AICUR=null;drawBus();}}
function aiDraw(){document.querySelectorAll(".aib").forEach(b=>b.classList.toggle("on",b.dataset.aiop===AICUR));
 const el=document.querySelector("#aiview .avr");if(!el)return;
 if(!AICUR){el.innerHTML=`<div class="aih">💬<span>Claude</span></div><div class="aiempty">Tria una suggerència a l'esquerra i prem<br><b>💬 Pensem-ho amb Claude</b></div>`;return;}
 const {f,it}=aiMsgOf(AICUR);const L=AICH[AICUR]||[];
 el.innerHTML=`<div class="aih">💬<span>Claude <small>· ${aiEsc(f&&f.nom||"")}</small></span><button data-aire title="Torna a començar">↺</button><button data-aicl title="Tanca aquesta suggerència">✕</button></div>
 <div class="aisug"><b>Suggerència${it&&it.at?" · "+new Date(it.at).toLocaleDateString("ca",{day:"numeric",month:"short"}):""}</b>${aiEsc(it&&it.t||"(no trobada)")}</div>
 <div class="ailog">${L.map((m,i)=>aiMsgHtml(m,i)).join("")}${AIBUSY?'<div class="aim a aiwait">Claude està pensant…</div>':""}</div>
 <div class="aiin"><textarea data-aiin placeholder="Parla amb Claude (Enter envia · Maj+Enter salt de línia)"></textarea><button class="btn" data-aisd>Envia</button></div>
 <div class="aiq">${["Proposa'm una resposta","Més curta","Més propera","Digues que ho farem","Digues que ja existeix i com es fa","Següent punt","Ajunta-ho en una sola resposta"].map(q=>`<button data-aiq>${q}</button>`).join("")}</div>`;
 const lg=el.querySelector(".ailog");lg.scrollTop=lg.scrollHeight;}
async function aiGuia(){if(GUIATX!==null)return GUIATX;try{const h=await (await fetch("guia.html",{cache:"no-store"})).text();const d=new DOMParser().parseFromString(h,"text/html");d.querySelectorAll("script,style,nav").forEach(e=>e.remove());GUIATX=(d.body.textContent||"").replace(/\s+/g," ").trim().slice(0,11000);}catch(_){GUIATX="";}return GUIATX;}
async function aiSys(k){const {u,mk,f,it}=aiMsgOf(k);const fam=uidFam(u);const M=f?convOf(f):[];
 const st=fam?({sol:"ha sol·licitat ser Sembradora",apr:"aprovada, pendent de pagament",act:"Sembradora (premium)"})[famSt(fam)]||"Planter (gratuïta)":"sense família";
 const conv=M.filter(m=>m.k!==mk).slice(-20).map(m=>`[${String(m.at||"").slice(0,16).replace("T"," ")}] ${m.de==="h"?"HORTOLÀ":"USUARI"}: ${String(m.t||"").slice(0,800)}`).join("\n");
 return `MANERA DE TREBALLAR (mana sobre tot):
- Treballeu UNA sola suggerència: la que hi ha a «SUGGERÈNCIA ACTUAL». La resta de la conversa és només context; no la responguis.
- Si la suggerència té diversos punts, enumera'ls en una línia cadascun i treballa només el primer. No passis al següent fins que l'Hortolà ho digui («Següent punt»). Quan t'ho demani («Ajunta-ho»), fes una sola resposta per a la família amb tots els punts acordats.
- Respostes breus i esquemàtiques. Format: text pla, guions per a les llistes i **negreta** només per a paraules clau. Sense títols.

SUGGERÈNCIA ACTUAL
Usuari: ${f&&f.nom||"usuari"} · Família: ${fam&&fam.nom||(f&&f.fam)||"—"} · Pla: ${st}
Data: ${String(it&&it.at||"").slice(0,16).replace("T"," ")}${it&&it.tipus==="err"?" · marcada com a «per millorar»":""}
Text: ${String(it&&it.t||"")}

RESTA DE LA CONVERSA (context)
${conv||"—"}

ECONOMIA: 100 espigues = 1 €. Les idees útils per a tothom es poden premiar amb espigues (normalment +500).

MANUAL D'USUARI DE L'APP (per saber què ja existeix):
${await aiGuia()}`;}
async function aiAsk(txt,vis){const k=AICUR;if(!k||AIBUSY)return;const L=AICH[k]=AICH[k]||[];L.push({role:"user",content:txt,...(vis?{vis}:{})});AIBUSY=1;aiDraw();
 try{const msgs=L.slice(-24).map(m=>({role:m.role,content:m.content}));
  const {data,error}=await window.MF_SB.functions.invoke("llegeix",{body:{hort:true,messages:msgs,system:await aiSys(k)}});
  if(error||!data||data.error)throw new Error((data&&data.error)||(error&&error.message)||"Error");
  L.push({role:"assistant",content:data.text||"(sense resposta)"});}
 catch(e){L.pop();toast("No s'ha pogut parlar amb Claude: "+String(e.message||e).slice(0,120));}
 AIBUSY=0;aiSave();if(AICUR===k){aiDraw();const ta=document.querySelector("#aiview [data-aiin]");ta&&ta.focus();}}
function aiOpen(k){AICUR=k;if(!AIVIEW)aiView(true);else aiDraw();if(!(AICH[k]||[]).length)aiAsk("Llegeix la suggerència actual. Digues-me en poques línies què demana (si té diversos punts, enumera'ls i quedem-nos amb el primer), si ja existeix a l'app i com, i proposa'm una resposta per a aquest punt.","Llegeix la suggerència i comencem");}
function aiUse(i,n){const m=(AICH[AICUR]||[])[+i];if(!m)return;const ps=[...String(m.content).matchAll(/<resposta>([\s\S]*?)<\/resposta>/g)].map(x=>x[1].trim());const t=ps[+n];if(!t)return;const {u}=aiMsgOf(AICUR);
 if(!AIVIEW){const bus=document.getElementById("bus");if(bus&&!bus.open)bus.open=true;}if(BOPEN!==u){BOPEN=u;drawBus();}
 setTimeout(()=>{const ta=document.querySelector(`[data-cvr="${u}"]`);if(ta){ta.value=t;ta.focus();ta.scrollIntoView({block:"center",behavior:"smooth"});toast("Resposta copiada: revisa-la i prem Envia");}},60);}
document.addEventListener("click",e=>{let b;
 if((b=e.target.closest("[data-aiop]"))){aiOpen(b.dataset.aiop);return;}
 if(e.target.closest("[data-avopen]")){aiView(true);return;}
 if(!e.target.closest("#aiview"))return;
 if(e.target.closest("[data-avx]")){aiView(false);return;}
 if(e.target.closest("[data-aicl]")){AICUR=null;aiDraw();return;}
 if(e.target.closest("[data-aire]")){delete AICH[AICUR];aiSave();aiOpen(AICUR);return;}
 if((b=e.target.closest("[data-aiq]"))){aiAsk(b.textContent);return;}
 if(e.target.closest("[data-aisd]")){const ta=document.querySelector("#aiview [data-aiin]");const t=ta&&ta.value.trim();if(t){ta.value="";aiAsk(t);}return;}
 if((b=e.target.closest("[data-aiuse]"))){const [i,n]=b.dataset.aiuse.split("|");aiUse(i,n);}});
document.addEventListener("keydown",e=>{const ta=e.target.closest&&e.target.closest("#aiview [data-aiin]");if(ta&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const t=ta.value.trim();if(t){ta.value="";aiAsk(t);}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&AIVIEW&&!e.target.closest("textarea"))aiView(false);});
