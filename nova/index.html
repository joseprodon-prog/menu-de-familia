<!doctype html><html lang="ca"><head><meta charset="utf-8">

<meta name="theme-color" content="#6e8c3c">

<link rel="apple-touch-icon" href="../icon-192.png">

<title>Menú de Família · nova navegació</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: columna de mòbil centrada; a l'ordinador, franges laterals blau Hortolà (llibre d'estil) */
:root{--crema:#f1ddb1;--paper:#fbfaf6;--ink:#2b3036;--mut:#6b7480;--line:#e3dfd3;--blue:#2a78c2;--blue2:#17599a;--bluesoft:#dbe9f7;--head:#6e8c3c;--green:#3f9a2e;--greensoft:#eaf4e3;--red:#c8352b;--gold:#e5a116;--goldsoft:#fbeccb;--ochre:#9a5a12;--ochresoft:#fdf0e3;--disp:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh}html{background:#2f74b5}
body{margin:0;background:#2f74b5;font:16px/1.4 var(--body);color:var(--ink)}
#app{position:relative;max-width:440px;height:100%;height:100dvh;margin:0 auto;background:var(--crema);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
p{margin:0}.mut{color:var(--mut)}
/* capçalera */
.top{display:flex;align-items:center;gap:8px;background:var(--head);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.top b{flex:1;font:700 20px var(--disp)}
.pillb{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:99px;border:2px solid #e8c56a;background:#fff8e6;color:var(--ink);font-weight:700}
.pillb svg{width:22px;height:22px}
.gear{width:40px;height:40px;border-radius:50%;border:0;background:#2a78c2;color:#fff;display:grid;place-items:center}
/* barra de pestanyes */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:12px;font-weight:600;color:var(--mut);min-height:48px}
.tabs button svg{width:28px;height:28px}
.tabs button[aria-selected=true]{color:var(--blue)}
.tabs button[aria-selected=true] .ti{background:var(--bluesoft)}
.ti{width:44px;height:32px;border-radius:99px;display:grid;place-items:center}
/* Capità */
.cap{position:absolute;right:16px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--head);color:#fff;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6;display:grid;place-items:center}
/* targetes */
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stack{display:flex;flex-direction:column;gap:12px}
.cta{width:100%;min-height:52px;border:0;border-radius:99px;background:var(--blue);color:#fff;font-weight:700;font-size:17px}
.cta:disabled{opacity:.4}
.sec{min-height:44px;border:0;border-radius:99px;background:#eef3e8;color:#2f6b1f;font-weight:700;padding:0 16px}
.seg{display:flex;background:#fff;border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:99px;min-height:38px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #f0ece2;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}.row span.r{margin-left:auto;color:var(--mut)}
.chev{color:#b8b0a0}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dish{background:var(--paper);border-radius:12px;padding:10px}
.dish small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.dish b{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.b{background:var(--bluesoft);color:var(--blue2)}.chip.g{background:var(--greensoft);color:#2f6b1f}.chip.o{background:var(--ochresoft);color:var(--ochre)}
/* graelles setmanals */
.grid{display:grid;grid-template-columns:44px 1fr 1fr;gap:5px;font-size:14px}
.grid .h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:center}
.grid .d{font-weight:700;display:flex;align-items:center}
.cell{min-height:46px;border:0;border-radius:10px;background:#fff;padding:6px;text-align:left;font-size:13.5px;line-height:1.2}
.card .cell{background:var(--paper)}.cell.off{background:transparent;border:1.5px dashed #d6ccb4;color:var(--mut);text-align:center}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin:1px}
/* flux a pantalla sencera */
.flow{position:absolute;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column}
.fh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;text-align:center}
.fh b{font-size:17px}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:#efebe1;font-size:18px}
.prog{display:flex;gap:6px;padding:0 16px 8px}.prog i{flex:1;height:5px;border-radius:3px;background:#e3dfd3}.prog i.on{background:var(--green)}
.fb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}
.ff{padding:14px 16px max(24px,calc(16px + env(safe-area-inset-bottom,0px)));display:flex;gap:10px;background:inherit;box-shadow:0 -8px 16px -12px rgba(0,0,0,.18)}
.ff .cta{flex:1}.ffin{padding:6px 0 24px;box-shadow:none;background:none}
.opt{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:600;font-size:16px;padding:10px 14px;text-align:left;display:flex;align-items:center;gap:10px}
.opt[aria-pressed=true]{background:var(--greensoft);border-color:#8fb874}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:7px;border:1.5px solid #c9c1ad;display:grid;place-items:center;color:#fff;font-size:15px}
.opt[aria-pressed=true] .ck{background:var(--green);border-color:var(--green)}
input.tx{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;background:#fff}
.mem{display:flex;gap:8px;align-items:center}
.mem input{flex:1}
.mem button{width:44px;height:44px;border-radius:50%;border:0;background:#efebe1}
/* full inferior */
.dim{position:absolute;inset:0;background:rgba(30,30,20,.4);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:86%;overflow-y:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:#d6ccb4;margin:0 auto 4px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:#2b3036;color:#fff;padding:10px 16px;border-radius:99px;z-index:40;font-weight:600;font-size:14px;white-space:nowrap}
.load{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.bar{width:220px;height:8px;border-radius:4px;background:#e3dfd3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width 1.6s ease}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc{background:#fff;border-radius:14px;overflow:hidden;border:0;padding:0;text-align:left}
.rc .im{aspect-ratio:4/3;display:grid;place-items:center;font-size:40px}
.rc b{display:block;padding:8px 10px 2px;font:600 15px var(--disp)}
.rc small{display:block;padding:0 10px 10px;color:var(--gold)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;align-items:center;gap:8px;justify-content:center;min-height:50px;border:0;border-radius:99px;background:var(--blue);color:#fff;font-weight:700}
.act svg{width:26px;height:26px;background:#fff;border-radius:7px;padding:1px}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f0ece2}
.li:last-child{border-bottom:0}
.li .cb{width:26px;height:26px;border-radius:8px;border:1.5px solid #c9c1ad;background:#fff;flex:none}
.li.done .cb{background:var(--green);border-color:var(--green)}.li.done b{text-decoration:line-through;color:var(--mut)}
.li small{display:block;color:var(--mut);font-size:13px}
.big{font:700 34px var(--disp);font-variant-numeric:tabular-nums}
.hero-ic svg{width:64px;height:64px}
.badge{font-size:12px;font-weight:700;color:#fff;background:var(--blue);border-radius:99px;padding:2px 8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.wel{display:flex;flex-direction:column;margin:-12px -16px 0}
.welsky{position:relative;background:linear-gradient(180deg,#a9d6f0 0%,#dff0f7 100%);height:230px;overflow:hidden}
.sun{position:absolute;top:22px;right:34px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#ffe58a 0 55%,rgba(255,229,138,.35) 56% 100%)}
.welart{position:absolute;inset:auto 0 0 0;height:200px}.welart svg{width:100%;height:100%;display:block}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9}.cloud:before{content:"";position:absolute;background:#fff;border-radius:50%}.c1{top:34px;left:26px;width:70px;height:20px}.c1:before{width:30px;height:30px;left:14px;top:-14px}.c2{top:70px;left:150px;width:54px;height:16px}.c2:before{width:24px;height:24px;left:12px;top:-11px}
.welbub{position:absolute;left:14px;top:16px;max-width:62%;background:#fff;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.welbody{padding:18px 16px 4px;display:flex;flex-direction:column;gap:6px}
.welist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.welit{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.welit b{display:block;font-size:15.5px}.welit small{color:var(--mut);font-size:13.5px;line-height:1.3}
.welic{flex:none;width:46px;height:46px;border-radius:12px;background:#fbf3e0;display:grid;place-items:center}.welic svg{width:32px;height:32px}
</style></head><body>

 ()=>`<div class="wel"><div class="welsky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="welart"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><rect width="160" height="90" fill="#cde9f6"/><circle cx="136" cy="17" r="8" fill="#ffd75e" stroke="#e0a52a" stroke-width="1.5"/><path d="M14 20h22a5 5 0 0 0-5-5 6 6 0 0 0-11 1 4 4 0 0 0-6 4z" fill="#fff" stroke="#b9d6e6" stroke-width="1"/><path d="M92 14h18a4 4 0 0 0-4-4 5 5 0 0 0-9 1 3 3 0 0 0-5 3z" fill="#fff" stroke="#b9d6e6" stroke-width="1"/><path d="M0 58c28-9 58-11 88-5s52 2 72-4v41H0z" fill="#9ccf5a"/><path d="M0 67c26-6 54-7 80-4s54 3 80-2v29H0z" fill="#7fb944"/><g stroke="#6b4423" stroke-width="1.8" stroke-linejoin="round"><rect x="18" y="54" width="4" height="12" fill="#a8562c"/><circle cx="20" cy="50" r="10" fill="#5f9a34"/></g><g stroke="#6b4423" stroke-width="1.8" stroke-linejoin="round"><rect x="139" y="54" width="4" height="12" fill="#a8562c"/><circle cx="141" cy="50" r="10" fill="#5f9a34"/></g><path d="M76 66c-2 8-8 16-16 24h40c-8-8-14-16-16-24z" fill="#e6c98f" stroke="#c9a565" stroke-width="1"/><g transform="translate(41,5) scale(1.22)"><g stroke="#6b4423" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="32" width="15" height="14" rx="1" fill="#fbf1dc"/><path d="M3 33.5 12.5 22 22 33.5z" fill="#d1453b"/><rect x="44" y="32" width="15" height="14" rx="1" fill="#fbf1dc"/><path d="M42 33.5 51.5 22 61 33.5z" fill="#eaa63a"/><rect x="38" y="15" width="4.5" height="9" fill="#a8562c"/><rect x="19" y="28" width="26" height="21" rx="1.2" fill="#fffaf0"/><path d="M16 30 32 14l16 16z" fill="#6e8c3c"/><rect x="28.5" y="38" width="7" height="11" rx="1" fill="#9a5a2b"/><rect x="9.5" y="37" width="6" height="9" rx="1" fill="#9a5a2b"/><rect x="48.5" y="37" width="6" height="9" rx="1" fill="#9a5a2b"/></g><g stroke="#6b4423" stroke-width="1"><rect x="22.5" y="32" width="4.5" height="4" fill="#8cc7ec"/><rect x="37" y="32" width="4.5" height="4" fill="#8cc7ec"/></g></g><g stroke="#6b4423" stroke-width="1.2" fill="#fff"><rect x="2" y="66" width="3" height="9" rx="1"/><rect x="8" y="66" width="3" height="9" rx="1"/><rect x="14" y="66" width="3" height="9" rx="1"/><rect x="20" y="66" width="3" height="9" rx="1"/><rect x="1" y="68.5" width="21" height="2.4"/></g><g stroke="#6b4423" stroke-width="1.2" fill="#fff"><rect x="136" y="66" width="3" height="9" rx="1"/><rect x="142" y="66" width="3" height="9" rx="1"/><rect x="148" y="66" width="3" height="9" rx="1"/><rect x="154" y="66" width="3" height="9" rx="1"/><rect x="135" y="68.5" width="21" height="2.4"/></g></svg></div></div>
   <div class="welbody"><h1>Menú de Família</h1><p class="mut">Tot el que passa a la cuina de casa, en un sol lloc.</p>
   <div class="welist">${[[IC.menu,"El menú de cada setmana","Pensat per a qui menja a casa i la temporada"],[IC.cart,"La compra feta","La llista surt sola, amb el que ja teniu al rebost"],[IC.receptari,"Les vostres receptes","Les de la família i les del Graner de totes les famílies"],[IC.despesa,"La despesa sota control","Què gasteu cada mes i a quines botigues podeu comprar"]].map(([i,t,d])=>`<div class="welit"><span class="welic">${i}</span><div><b>${t}</b><small>${d}</small></div></div>`).join("")}</div></div></div>`,
 ()=>`<h2>Crea el compte</h2><p class="mut">T'enviarem un enllaç per entrar, sense contrasenya.</p><input class="tx" id="em" type="email" inputmode="email" autocomplete="email" placeholder="el-teu@correu.cat" value="${esc(S.email)}">`,
 ()=>`<h2>Qui sou a casa?</h2><p class="mut">El nom de la família i les persones que hi mengen.</p><input class="tx" id="fn" value="${esc(S.fam)}" aria-label="Nom de la família">
   <div class="stack">${S.mem.map((m,i)=>`<div class="mem"><input class="tx" data-mem="${i}" value="${esc(m)}" aria-label="Membre ${i+1}">${i?`<button data-a="delmem" data-i="${i}" aria-label="Treu">✕</button>`:""}</div>`).join("")}</div><button class="sec" data-a="addmem">＋ Afegeix una persona</button>`,
 ()=>`<h2>Hi ha alguna cosa que no podeu menjar?</h2><p class="mut">Al·lèrgies o intoleràncies de qualsevol de vosaltres. Ho podeu detallar per persona a ⚙︎.</p>
   <div class="stack">${ALG.map(x=>`<button class="opt" data-alg="${x}" aria-pressed="${S.alg.includes(x)}">${x}<span class="ck">✓</span></button>`).join("")}<button class="opt" data-alg="cap" aria-pressed="${S.res}">Ho mengem tot<span class="ck">✓</span></button></div>`,
 ()=>`<h2>On viviu?</h2><p class="mut">Per adaptar el menú al temps que farà i trobar el vostre veïnat.</p><input class="tx" id="mu" placeholder="Escriu el municipi" value="${esc(S.muni)}" autocomplete="off"><div class="stack" id="mul">${muniL()}</div>`,
 ()=>`<h2>Tingues l'app a mà</h2><p class="mut">Afegeix-la a la pantalla d'inici: s'obrirà com una app i us podrem avisar el diumenge per preparar la setmana.</p>
   <div class="card stack"><div style="display:flex;gap:10px"><b>1</b>Toca <b>Comparteix</b> (el quadrat amb la fletxa) a Safari.</div><div style="display:flex;gap:10px"><b>2</b>Tria <b>Afegeix a la pantalla d'inici</b>.</div><div style="display:flex;gap:10px"><b>3</b>Obre-la des de la icona nova.</div></div>`,
 ()=>`<div class="load"><h2>Preparem la primera setmana…</h2><p class="mut">Temporada de tardor · ${esc(S.muni||"el vostre municipi")}</p><div class="bar"><i id="lb"></i></div></div>`];
 const n=S.onb,ok=[1,!!/.+@.+\..+/.test(S.email),S.mem.some(m=>m.trim()),S.alg.length||S.res,!!MUNIS.includes(S.muni),1,0][n];
 const lab=["Comencem","Envia l'enllaç","Següent","Següent","Següent","Ja està","" ][n];
 return `<div class="flow" style="position:relative;flex:1;${n===0?"background:var(--crema)":""}"><div class="fh">${n&&n<6?`<button class="rb" data-a="oback" aria-label="Enrere">‹</button>`:"<span></span>"}<span></span><span></span></div>
 ${n&&n<6?`<div class="prog">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`:""}
 <div class="fb">${st[n]()}${lab?`<div class="ff ffin">${n===0?`<button class="sec" data-a="codi">Tinc un codi</button>`:""}${n===5?`<button class="sec" data-a="onext">Més tard</button>`:""}<button class="cta" data-a="onext" ${ok?"":"disabled"}>${lab}</button></div>`:""}</div></div>`;}
function muniL(){const q=(S.muni||"").toLowerCase();if(!q||MUNIS.includes(S.muni))return S.muni&&MUNIS.includes(S.muni)?`<div class="chip g">✓ ${esc(S.muni)}</div>`:"";return MUNIS.filter(m=>m.toLowerCase().startsWith(q)).slice(0,5).map(m=>`<button class="opt" data-muni="${m}">${m}</button>`).join("")||`<p class="mut">Cap municipi amb aquest nom.</p>`;}

/* ---------- Pestanyes ---------- */
function tSet(){const m=S.menu||MENU0;
 return `<div class="stack">
 ${S.ready?`<div class="card stack"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Dilluns 2 de nov.</h3><span class="chip g">✓ Setmana preparada</span></div><div class="today"><div class="dish"><small>Dinar</small><b>${esc(m[0][0])}</b></div><div class="dish"><small>Sopar</small><b>${esc(m[0][1])}</b></div></div></div>`:
 `<div class="card stack"><h3>Setmana del 2 al 8 de novembre</h3><p class="mut">Encara no està preparada. Són 4 tocs: qui hi serà, el menú i la llista.</p><button class="cta" data-a="prep">Prepara la setmana</button></div>`}
 ${S.ready?`<div class="card stack"><h3>La setmana</h3><div class="grid"><span></span><span class="h">Dinar</span><span class="h">Sopar</span>${m.map((r,i)=>`<span class="d">${DIES[i]}</span>${r.map(x=>`<div class="cell${x==="—"?" off":""}">${x==="—"?"fora":esc(x)}</div>`).join("")}`).join("")}</div><button class="sec" data-a="prep">Canvia la setmana</button></div>`:""}
 <div class="chips"><span class="chip b">🍂 Tardor</span><span class="chip b">☔ Dimecres plou</span><span class="chip">${esc(S.muni||"Teià")}</span></div></div>`;}
function tCompra(){const s=S.sub.compra;return `<div class="stack"><div class="seg">${[["llista","Llista"],["rebost","Rebost"],["targetes","Targetes"]].map(([k,l])=>`<button data-sub="compra:${k}" aria-pressed="${s===k}">${l}</button>`).join("")}</div>
 ${s==="llista"?(S.ready?llistaH(false):`<div class="card stack"><p>La llista surt sola quan prepareu la setmana.</p><button class="cta" data-a="prep">Prepara la setmana</button></div>`):
  s==="rebost"?`<div class="card">${[["Llenties","400 g"],["Arròs","1 kg"],["Oli d'oliva","2 l"],["Ous","6 u"],["Tomàquet triturat","2 pots"]].map(([n,q])=>`<div class="li"><b style="flex:1">${n}</b><span class="mut">${q}</span></div>`).join("")}</div><p class="mut">Es va omplint sol amb els tiquets i el que gasteu dels menús.</p>`:
  `<div class="stack">${[["Bonpreu","#e4572e"],["Mercadona","#2e8b57"],["Caprabo","#c8352b"]].map(([n,c])=>`<button class="card" style="border:0;display:flex;align-items:center;gap:12px;text-align:left"><span style="width:44px;height:30px;border-radius:6px;background:${c}"></span><b style="flex:1">${n}</b><span class="chev">Mostra ›</span></button>`).join("")}</div>`}</div>`;}
function llistaH(fl){return LLISTA.map(([g,it])=>`<div class="card"><h3 style="margin-bottom:4px">${g}</h3>${it.map(([n,q,b])=>{const k=g+n;return `<div class="li${S.done[k]?" done":""}"><button class="cb" data-chk="${esc(k)}" aria-label="Comprat"></button><div style="flex:1"><b>${n}</b> <span class="mut">· ${q}</span>${b?`<small>Més barat a ${b}</small>`:""}</div></div>`;}).join("")}</div>`).join("")+`<p class="mut">✓ Llenties, arròs i oli: ja en teniu al rebost.</p>`;}
function tRec(){const s=S.sub.rec;return `<div class="stack"><div class="acts"><button class="act" data-a="crea">${IC.crea}Crea</button><button class="act" data-a="qc">${IC.qc}Què cuino?</button></div>
 <div class="seg"><button data-sub="rec:fam" aria-pressed="${s==="fam"}">De la família</button><button data-sub="rec:gra" aria-pressed="${s==="gra"}">Del Graner</button></div>
 <div class="rgrid">${(s==="fam"?RECS:RECS.slice().reverse()).map(([n,e,c,v])=>`<button class="rc" data-a="rec"><div class="im" style="background:${c}">${e}</div><b>${n}</b><small>${"★".repeat(v)}</small></button>`).join("")}</div></div>`;}
function tDesp(){return `<div class="stack"><button class="cta" data-a="tiquet">📷 Fes una foto del tiquet</button>
 <div class="card"><p class="mut">Octubre</p><p class="big">412,60 €</p><p class="mut">−8 % que el setembre · 14 compres</p></div>
 <div class="card"><h3 style="margin-bottom:4px">Últimes compres</h3>${[["Bonpreu","27 oct.","68,40 €"],["Mercat","25 oct.","23,10 €"],["Mercadona","22 oct.","91,75 €"]].map(([b,d,i])=>`<div class="li"><div style="flex:1"><b>${b}</b><small>${d}</small></div><b>${i}</b></div>`).join("")}</div>
 <button class="card row" style="border:0" data-a="preus"><b>On és més barat cada producte</b><span class="r chev">›</span></button></div>`;}

/* ---------- B · Preparar la setmana ---------- */
function flowB(){const st=S.step,t=["Qui hi serà?","El menú","La llista"][st];
 let b="";
 if(st===0){b=`<p class="mut">Com la setmana passada. Toca una casella per canviar-la.</p><div class="grid"><span></span><span class="h">Dinar</span><span class="h">Sopar</span>${S.disp.map((r,i)=>`<span class="d">${DIES[i]}</span>${r.map((p,j)=>`<button class="cell${p.length?"":" off"}" data-cell="${i}:${j}">${p.length?p.map(k=>`<span class="av" style="background:${COL[k]}">${esc(S.mem[k][0])}</span>`).join(""):"ningú"}</button>`).join("")}`).join("")}</div>`;}
 if(st===1){b=S.menu?`<div class="chips"><span class="chip b">🍂 Tardor</span><span class="chip b">☔ Dimecres plourà: plat de cullera</span><span class="chip g">Res repetit de les 3 últimes setmanes</span></div><div class="grid"><span></span><span class="h">Dinar</span><span class="h">Sopar</span>${S.menu.map((r,i)=>`<span class="d">${DIES[i]}</span>${r.map((x,j)=>x==="—"?`<div class="cell off">fora</div>`:`<button class="cell" data-dish="${i}:${j}">${esc(x)}</button>`).join("")}`).join("")}</div><p class="mut">Toca un plat per canviar-lo.</p>`:`<div class="load"><h3>El Capità prepara el menú…</h3><div class="bar"><i id="lb"></i></div></div>`;}
 if(st===2){b=llistaH(true);}
 const lab=["Següent","Fes la llista","Comparteix la llista"][st];
 return `<div class="flow"><div class="fh"><button class="rb" data-a="fback" aria-label="Enrere">‹</button><b>${t}</b><button class="rb" data-a="fclose" aria-label="Tanca">✕</button></div><div class="prog">${[0,1,2].map(i=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div><div class="fb">${b}</div><div class="ff"><button class="cta" data-a="fnext" ${st===1&&!S.menu?"disabled":""}>${lab}</button></div></div>`;}

/* ---------- Fulls inferiors ---------- */
function sheet(h){close();const d=document.createElement("div");d.className="dim";d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${h}</div>`;d.addEventListener("click",e=>{if(e.target===d)close();});$("#app").appendChild(d);}
function close(){document.querySelectorAll(".dim").forEach(x=>x.remove());}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;$("#app").appendChild(d);setTimeout(()=>d.remove(),2200);}
const rows=L=>`<div class="card" style="padding:4px 12px">${L.map(([i,t,r])=>`<button class="row" data-a="nop"><span style="width:30px;display:grid;place-items:center">${i}</span><b>${t}</b><span class="r">${r||""} <span class="chev">›</span></span></button>`).join("")}</div>`;

/* ---------- Esdeveniments ---------- */
document.addEventListener("input",e=>{const t=e.target;if(t.id==="em")S.email=t.value;if(t.id==="fn")S.fam=t.value;if(t.dataset.mem!=null)S.mem[+t.dataset.mem]=t.value;
 if(t.id==="mu"){S.muni=t.value;$("#mul").innerHTML=muniL();}
 const b=document.querySelector('.ff .cta');if(b&&S.onb<99){const ok=[1,/.+@.+\..+/.test(S.email),S.mem.some(m=>m.trim()),S.alg.length||S.res,MUNIS.includes(S.muni),1][S.onb];b.disabled=!ok;}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const a=t.dataset.a;
 if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
 if(t.dataset.sub){const[k,v]=t.dataset.sub.split(":");S.sub[k]=v;render();return;}
 if(t.dataset.alg){const x=t.dataset.alg;if(x==="cap"){S.res=!S.res;if(S.res)S.alg=[];}else{S.res=false;S.alg=S.alg.includes(x)?S.alg.filter(y=>y!==x):[...S.alg,x];}render();return;}
 if(t.dataset.muni){S.muni=t.dataset.muni;render();return;}
 if(t.dataset.chk){S.done[t.dataset.chk]=!S.done[t.dataset.chk];render();return;}
 if(t.dataset.cell){const[i,j]=t.dataset.cell.split(":").map(Number);const p=S.disp[i][j];
  sheet(`<h3>${["Dilluns","Dimarts","Dimecres","Dijous","Divendres","Dissabte","Diumenge"][i]} · ${j?"sopar":"dinar"}</h3>${S.mem.map((m,k)=>`<button class="opt" data-pm="${i}:${j}:${k}" aria-pressed="${p.includes(k)}"><span class="av" style="background:${COL[k]}">${esc(m[0])}</span>${esc(m)}<span class="ck">✓</span></button>`).join("")}<button class="cta" data-a="sclose">Fet</button>`);return;}
 if(t.dataset.pm){const[i,j,k]=t.dataset.pm.split(":").map(Number);const p=S.disp[i][j];S.disp[i][j]=p.includes(k)?p.filter(x=>x!==k):[...p,k].sort();t.setAttribute("aria-pressed",String(S.disp[i][j].includes(k)));render();const d=document.querySelector(".dim");if(!d){}return;}
 if(t.dataset.dish){const[i,j]=t.dataset.dish.split(":").map(Number);const cur=S.menu[i][j];
  sheet(`<h3>${esc(cur)}</h3><p class="mut">Canvia'l per un d'aquests, pensats per a la temporada:</p>${ALTS.slice(0,3).map(x=>`<button class="opt" data-alt="${i}:${j}:${esc(x)}">${esc(x)}</button>`).join("")}<button class="sec" data-a="nop">Veure la recepta</button><button class="sec" data-alt="${i}:${j}:—">Aquest àpat no cuinem</button>`);return;}
 if(t.dataset.alt){const[i,j,...x]=t.dataset.alt.split(":");S.menu[+i][+j]=x.join(":");close();render();return;}
 switch(a){
  case"onext":if(S.onb===6)return;S.onb++;if(S.onb===6){render();setTimeout(()=>{const l=$("#lb");if(l)l.style.width="100%";},50);setTimeout(()=>{S.onb=99;S.tab="setmana";startB();},1900);return;}render();break;
  case"oback":S.onb=Math.max(0,S.onb-1);render();break;
  case"codi":sheet(`<h3>Uneix-te a una família</h3><input class="tx" placeholder="Codi de 16 lletres"><button class="cta" data-a="sclose">Entra</button>`);break;
  case"addmem":S.mem.push("");render();break;
  case"delmem":S.mem.splice(+t.dataset.i,1);render();break;
  case"prep":startB();break;
  case"fback":if(S.step===0){S.flow=null;}else S.step--;render();break;
  case"fclose":S.flow=null;render();toast("Esborrany desat");break;
  case"fnext":if(S.step===0){S.step=1;S.menu=null;render();setTimeout(()=>{const l=$("#lb");if(l)l.style.width="100%";},50);setTimeout(()=>{S.menu=MENU0.map((r,i)=>r.map((x,j)=>S.disp[i][j].length?x:"—"));render();},1700);}
   else if(S.step===1){S.step=2;render();}else{S.flow=null;S.ready=true;S.tab="setmana";render();toast("Llista compartida ✓");}break;
  case"sclose":close();break;
  case"conf":sheet(`<h3>Configuració</h3>${rows([["👨‍👩‍👧","Membres i gustos",S.mem.length+" persones"],["📍","Municipi",S.muni||"—"],["🍳","Equipament de cuina",""],["💶","Pressupost setmanal",""],["🧭","Apartats de l'app","4 de 4"],["🔔","Avisos","Diumenge"]])}${rows([["🚪","Surt d'aquesta família",""],["🗑️","Esborra el compte",""]])}`);break;
  case"joc":sheet(`<h3>L'hort</h3><p class="mut">175 espigues · Nivell 2</p>${rows([[IC.hudsilo,"El paller","175 🌾"],[IC.shopico,"Botiga d'El Sortidor",""],[IC.veiico,"El veïnat","Teià"]])}`);break;
  case"capita":sheet(`<h3>🥬 Capità Enciam</h3><div class="card">Què vols saber? Puc canviar plats del menú, explicar-te una recepta o dir-te què fer amb el que teniu.</div><div class="chips"><span class="chip">Què sopem avui?</span><span class="chip">Canvia el dinar de dimarts</span><span class="chip">Tinc carbassa: idees?</span></div><input class="tx" placeholder="Escriu o dicta…"><button class="row" data-a="nop" style="border:0"><b>💬 Parla amb l'Hortolà</b><span class="r">Sembradors ›</span></button>`);break;
  case"crea":sheet(`<h3>Crea una recepta</h3><p class="mut">Pantalla sencera de 3 passos: aporta, il·lustra, revisa (la mateixa d'ara).</p><button class="cta" data-a="sclose">D'acord</button>`);break;
  case"qc":sheet(`<h3>Què cuino amb el que tinc?</h3><p class="mut">Fins a 3 fotos o els ingredients escrits → 3 plats.</p><button class="cta" data-a="sclose">D'acord</button>`);break;
  case"tiquet":toast("S'obre la càmera");break;
  case"rec":case"preus":case"nop":toast("Pantalla de detall");break;}
});
function startB(){S.disp=S.disp||DIES.map((d,i)=>[i>4?[0,1,2,3]:[0,1],i===2?[0,1,2]:i>4?[]:[0,1,2,3]].map(x=>x.filter(k=>k<S.mem.length)));S.flow=1;S.step=0;render();}
render();
</script>
</body></html>
